# Per-PR preview. Skipped, not failed, until set up. This job builds pull-request code,
# so it uses its own CLOUDFLARE_PREVIEW_API_TOKEN, never the production token, and only
# the steps that call Cloudflare see it. `readiness` holds no secret value.
# Each preview gets its own D1 database and a seeded password derived from PREVIEW_SEED_SECRET.
# Setup and token scopes: see docs/ci/pipelines.md
# Only a PR into the default branch or production deploys; a stacked PR (any other base) skips,
# and its roll-up gets the one preview of the whole feature.
name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    name: Check preview setup
    if: github.base_ref == github.event.repository.default_branch || github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check preview setup
        id: gate
        env:
          HAS_ACCOUNT_ID: ${{ (vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID) != '' }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN != '' }}
          HAS_SEED_SECRET: ${{ secrets.PREVIEW_SEED_SECRET != '' }}
          PROD_TOKEN_AT_REPO_LEVEL: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: bun scripts/ci/deploy-gate.ts ready preview

  deploy-preview:
    name: Deploy preview
    needs: readiness
    runs-on: ubuntu-latest
    if: needs.readiness.outputs.ready == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision per-PR D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          bun scripts/ci/setup-preview-db.ts "$PR_NUMBER" || {
            echo "::error::Preview D1 provisioning failed. If the log says Authentication error, the preview token lacks D1 Edit. See docs/ci/pipelines.md"
            exit 1
          }

      - name: Migrate per-PR D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: bunx wrangler d1 migrations apply DATABASE --env preview --remote

      - name: Seed per-PR D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_SEED_SECRET: ${{ secrets.PREVIEW_SEED_SECRET }}
        run: bun scripts/seed-preview.ts --preview --pr "$PR_NUMBER"

      # VITE_SANDBOX=1 puts the dev-only routes (/sandbox.json, later /sandbox and the kitchen sink)
      # into this preview build and sets SANDBOX_ENABLED on its Worker. The production and staging
      # builds never set it, so their bundles hold no sandbox code (app/lib/sandbox/switch.ts, #47).
      - name: Build (preview env)
        env:
          CLOUDFLARE_ENV: preview
          VITE_SANDBOX: "1"
        run: bun run build

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          OUT=$(bunx wrangler versions upload --preview-alias "pr-$PR_NUMBER" --var "RELEASE_VERSION:$HEAD_SHA" --var ENVIRONMENT:preview 2>&1)
          echo "$OUT"
          ALIAS_URL=$(printf '%s' "$OUT" | grep -oE 'Version Preview Alias URL: https://\S+' | awk '{print $NF}')
          VERSION_URL=$(printf '%s' "$OUT" | grep -oE 'Version Preview URL: https://\S+' | awk '{print $NF}')
          URL_PATTERN='^https://[A-Za-z0-9./-]+$'
          if ! printf '%s' "$ALIAS_URL" | grep -qE "$URL_PATTERN" || ! printf '%s' "$VERSION_URL" | grep -qE "$URL_PATTERN"; then
            echo "::error::Could not extract preview URLs from wrangler output — its format may have changed. See the log above."
            exit 1
          fi
          {
            echo "alias_url=$ALIAS_URL"
            echo "version_url=$VERSION_URL"
          } >> "$GITHUB_OUTPUT"

      # The seed summary comes from the seed script itself (--describe), so
      # extending fixtures in scripts/seed-preview.ts automatically updates
      # every future PR comment — no workflow edit needed. It shows no password.
      - name: Compose PR comment
        env:
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Preview deployment"
            echo
            echo "**$ALIAS_URL**"
            echo
            echo "Per-commit version: $VERSION_URL"
            echo "Commit: \`$COMMIT_SHA\`"
            echo
            echo "Data: this PR gets its **own D1 database** (created when the PR"
            echo "opens, deleted when it closes). The preview R2 bucket is shared"
            echo "across all PR previews."
            echo
            bun scripts/seed-preview.ts --describe
            echo
            echo "No manual teardown needed — uploaded versions age out on their"
            echo "own, and the per-PR database is deleted on close by"
            echo "\`preview-cleanup.yml\`."
          } > "$RUNNER_TEMP/preview-comment.md"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: preview
          path: ${{ runner.temp }}/preview-comment.md
