name: CI

on:
  push:
    branches: [staging, production]
  # Every PR, not only those into staging or production: a stacked PR targets the PR below it.
  # Which jobs run depends on the PR's base (docs/ci/pipelines.md#which-checks-run-where):
  # into the default branch or production, everything; into any other branch (a stacked PR),
  # the lean job only. The default branch is read from the event, never named here.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A stacked PR: typecheck, the house linter and the unit tests. Not a required check; the
  # full suite runs once, on the roll-up into the default branch.
  lean:
    name: Lean (stacked PR, typecheck + lint + unit)
    if: github.event_name == 'pull_request' && github.base_ref != github.event.repository.default_branch && github.base_ref != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The lint baseline is compared with the branch a pull request merges into.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version  # one pinned version for every workflow

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The lean tier of scripts/verify.sh. No network beyond the install, no build, no browser.
      - name: Lean gates
        run: ./scripts/verify.sh --lean

  baseline:
    name: Baseline (typecheck + test + harness-check)
    if: github.event_name != 'pull_request' || github.base_ref == github.event.repository.default_branch || github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The lint baseline is compared with the branch a pull request merges into.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version  # one pinned version for every workflow

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply local D1 migrations
        run: bun run db:migrate:local

      - name: Baseline gates
        # One entry point: scripts/verify.sh owns WHICH gates run, so adding one is a
        # one-line change there rather than a workflow change.
        run: ./scripts/verify.sh --baseline
        env:
          # Read-only (`contents: read` above). Lets the harness gate compare the live
          # ruleset with .github/repo-rules.json; without it the gate prints a notice.
          GH_TOKEN: ${{ github.token }}

      # The line-coverage floors (scripts/coverage-floors.ts), a full-tier gate: it reruns the app
      # tests under v8 coverage, so it stays out of the quick set and the lean job. Here it runs in
      # a required job, so a PR into the default branch or production cannot drop a folder under its floor.
      - name: Coverage floors
        run: ./scripts/verify.sh --only coverage

  build:
    name: Build (Cloudflare Workers)
    if: github.event_name != 'pull_request' || github.base_ref == github.event.repository.default_branch || github.base_ref == 'production'
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The budget file on the base branch is read with git, so git needs it.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version  # one pinned version for every workflow

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Through the declared gate, not a hardcoded command, so CI cannot drift
      # from what scripts/verify.sh declares.
      - name: Build
        run: ./scripts/verify.sh --only build

      # After the build, on the build it made: no second build. Fails a route or the Worker over its
      # budget in .github/size-budgets.json and prints the table (docs/ci/pipelines.md#bundle-budgets).
      - name: Bundle budgets
        run: ./scripts/verify.sh --only size-budgets

      # After the build, on the build it made: this is the production build (no VITE_SANDBOX), so it
      # fails when a sandbox route, its code or the SANDBOX_ENABLED var reached it (issue #47).
      - name: No sandbox in the production build
        run: ./scripts/verify.sh --only sandbox-absent

      # A PR only lowers a budget: compared with the base branch's file, no build needed.
      - name: Budgets only shrink
        if: github.event_name == 'pull_request'
        run: bun run size --ratchet "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  # Thin, stable smoke specs (auth + critical paths) — the automated regression net.
  # Feature-level proof is the feature-verifier sub-agent → .verify/<slug>/verdict.md in the PR (not run in CI).
  e2e:
    name: E2E smoke (Playwright)
    if: github.event_name != 'pull_request' || github.base_ref == github.event.repository.default_branch || github.base_ref == 'production'
    # Pinned: Playwright ships no Chromium for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    needs: baseline
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version  # one pinned version for every workflow

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply local D1 migrations
        run: bun run db:migrate:local

      # Fixture logins (admin / user / banned) that signed-in specs use.
      - name: Seed local D1
        run: bun run db:seed

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Declared gate, same reason as `build` above.
      - name: Run e2e tests
        run: ./scripts/verify.sh --only e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A PR into the default branch or production: the Effect language service's diagnostics (floating
  # effects, untyped failures). About 20 s, so not a local gate; it runs beside the others here, costing
  # no wall time (docs/agents/lint.md#effect-diagnostics). Fails on an error, not on a warning.
  effect-diagnostics:
    name: Effect diagnostics
    if: github.event_name == 'pull_request' && (github.base_ref == github.event.repository.default_branch || github.base_ref == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version  # one pinned version for every workflow

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The route types the app imports are generated, as `bun run typecheck` does before tsc.
      - name: Generate types
        run: bun run typegen

      - name: Effect diagnostics
        run: bun run lint:effect

  # A PR into the default branch or production: the size table measured here against the base branch,
  # not copied from the PR body (docs/ci/pipelines.md#reading-the-size-table). Read-only; `report` posts it.
  size:
    name: Size (against the base branch)
    if: github.event_name == 'pull_request' && (github.base_ref == github.event.repository.default_branch || github.base_ref == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The base branch is built in a temporary worktree, so git needs it.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version  # one pinned version for every workflow

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Measure this PR and the base branch
        run: bun run size --base "origin/$BASE_REF" --json size/size.json --markdown size/size.md
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Upload the size report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: size
          path: size/
          retention-days: 14

  # The same PRs: Lighthouse (mobile) on the production build served locally with the seeded database,
  # this PR and the base branch, median of three runs per page. Limits in .github/lighthouse-limits.json
  # only warn. Reports stay in this run's artifacts; nothing goes to a public report host.
  lighthouse:
    name: Lighthouse (mobile, against the base branch)
    if: github.event_name == 'pull_request' && (github.base_ref == github.event.repository.default_branch || github.base_ref == 'production')
    # Pinned like e2e: the runner image must ship Chrome.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version  # one pinned version for every workflow

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each ref is built in its own worktree with a .dev.vars that sets BETTER_AUTH_URL to the local
      # origin and a throwaway secret: a production build refuses every request without them.
      - name: Run Lighthouse on this PR and the base branch
        run: bun run lighthouse --base "origin/$BASE_REF" --reports lighthouse/reports --json lighthouse/results.json --markdown lighthouse/lighthouse.md
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: lighthouse/
          retention-days: 14

  # Keeps ONE comment up to date, found by its hidden first line. The only job with a write
  # permission: it checks out nothing and runs no PR code, it only reads the two artifacts.
  # A PR from a fork gets a read-only token, so it skips this job; its numbers are in the artifacts.
  report:
    name: Size and Lighthouse comment
    needs: [size, lighthouse]
    if: always() && github.event_name == 'pull_request' && (github.base_ref == github.event.repository.default_branch || github.base_ref == 'production') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download the reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          path: report/

      - name: Post or update the comment
        run: |
          marker='<!-- ci:size-lighthouse -->'
          {
            echo "$marker"
            echo "## Size (gzip bytes, against the base branch)"
            echo
            cat report/size/size.md 2>/dev/null || echo "Not measured: the Size job failed. See its log."
            echo
            cat report/lighthouse/lighthouse.md 2>/dev/null || echo "Lighthouse did not finish: see its log."
            echo
            echo "Reports: the lighthouse artifact of [this run]($RUN_URL)."
          } > comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# The dedicated `non-negotiables` job that stood here was DELETED, not moved: it
# re-ran `check-non-negotiables.ts` over the same tree the `baseline` job had
# already swept via `./scripts/verify.sh --baseline`, with no caching between
# them. Its one unique step — the selftest, which proves the gate can fail
# before anyone trusts that it passed — is now a declared gate
# (`non-negotiables-selftest` in scripts/verify.sh), so it runs in baseline
# alongside the sweep and that script stays the single answer to "which gates
# run".
#
# Replaced the `effect-ts-grep` job (a lexical sweep over ADDED DIFF LINES).
# It matched `grep -E '\bthrow new\b'`, so `throw err` walked through; it never
# checked try/catch or Effect.promise at all; its zod pattern was double-quote
# only; non-negotiable #4 (a unit test per helper/repository) had no gate
# anywhere; and because it only read the diff, a violation that moved between
# files became invisible. scripts/check-non-negotiables.ts walks the TypeScript
# AST over the whole tree instead, and carries its own failing fixtures.
