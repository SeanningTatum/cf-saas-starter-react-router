name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline (typecheck + test + harness-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply local D1 migrations
        run: bun run db:migrate:local

      - name: Setup Node 24
        # brain-axi 0.3.0 stores the brain with the built-in node:sqlite (Node >= 24).
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install brain-axi CLI
        # Pinned for reproducible CI — bump deliberately when adopting a newer CLI.
        run: npm i -g github:SeanningTatum/brain-axi#v0.3.0

      - name: Create brain + declare gates
        # brain.db is gitignored, so CI builds a fresh one; scripts/brain-setup.sh
        # is the tracked list of gates, shared with init.sh and local checkouts.
        run: ./scripts/brain-setup.sh

      - name: Baseline gates
        # One entry point: brain-setup.sh owns WHICH gates run, so adding one is a
        # one-line change there rather than a workflow change.
        run: brain verify --stage baseline

  build:
    name: Build (Cloudflare Workers)
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node 24
        # brain-axi 0.3.0 stores the brain with the built-in node:sqlite (Node >= 24).
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install brain-axi CLI
        run: npm i -g github:SeanningTatum/brain-axi#v0.3.0

      - name: Create brain + declare gates
        run: ./scripts/brain-setup.sh

      # Through the declared gate, not a hardcoded command, so CI cannot drift
      # from what scripts/brain-setup.sh declares.
      - name: Build
        run: brain verify --only build

  # Thin, stable smoke specs (auth + critical paths) — the automated regression net.
  # Feature-level proof is the feature-verifier sub-agent → `brain verifications add` (not run in CI).
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply local D1 migrations
        run: bun run db:migrate:local

      - name: Setup Node 24
        # brain-axi 0.3.0 stores the brain with the built-in node:sqlite (Node >= 24).
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install brain-axi CLI
        run: npm i -g github:SeanningTatum/brain-axi#v0.3.0

      - name: Create brain + declare gates
        run: ./scripts/brain-setup.sh

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Declared gate, same reason as `build` above.
      - name: Run e2e tests
        run: brain verify --only e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# The dedicated `non-negotiables` job that stood here was DELETED, not moved: it
# re-ran `check-non-negotiables.ts` over the same tree the `baseline` job had
# already swept via `brain verify --stage baseline`, with no caching between
# them. Its one unique step — the selftest, which proves the gate can fail
# before anyone trusts that it passed — is now a declared gate
# (`non-negotiables-selftest` in scripts/brain-setup.sh), so it runs in baseline
# alongside the sweep and that script stays the single answer to "which gates
# run".
#
# Replaced the `effect-ts-grep` job (a lexical sweep over ADDED DIFF LINES).
# It matched `grep -E '\bthrow new\b'`, so `throw err` walked through; it never
# checked try/catch or Effect.promise at all; its zod pattern was double-quote
# only; non-negotiable #4 (a unit test per helper/repository) had no gate
# anywhere; and because it only read the diff, a violation that moved between
# files became invisible. scripts/check-non-negotiables.ts walks the TypeScript
# AST over the whole tree instead, and carries its own failing fixtures.
