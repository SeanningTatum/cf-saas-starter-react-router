name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline (typecheck + test + harness-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply local D1 migrations
        run: bun run db:migrate:local

      - name: Install brain-axi CLI
        # Pinned for reproducible CI — bump deliberately when adopting a newer CLI.
        # v0.2.0 is the first release carrying the state-integrity gates (schema
        # validation, one verdict parser, index-drift, receipts, `check
        # --strict`). Before this bump CI ran the older check set, so the gate
        # covering the documented trust boundary — gates on a machine the agent
        # does not control — was live nowhere.
        run: npm i -g github:SeanningTatum/brain-axi#v0.2.0

      - name: Baseline gates (declared in .brain/verify.json)
        # One entry point: the registry owns WHICH gates run, so adding one is a
        # data change rather than a workflow change. Replaces the previous
        # hardcoded typecheck/test/harness-check step list, which drifted from
        # the recipe and the slash command.
        run: brain verify --stage baseline

  build:
    name: Build (Cloudflare Workers)
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install brain-axi CLI
        run: npm i -g github:SeanningTatum/brain-axi#v0.2.0

      # Through the registry, not a hardcoded command. `build` is declared at
      # stage `verify` in .brain/verify.json, and nothing ran that stage — CI
      # invoked `bun run build` directly, so the registry entry was decorative
      # and could drift from what CI actually did without anything noticing.
      - name: Build
        run: brain verify --only build

  # Thin, stable smoke specs (auth + critical paths) — the automated regression net.
  # Feature-level proof is the feature-verifier sub-agent → .brain/features/<slug>/verifications/ (not run in CI).
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply local D1 migrations
        run: bun run db:migrate:local

      - name: Install brain-axi CLI
        run: npm i -g github:SeanningTatum/brain-axi#v0.2.0

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Registry-driven, same reason as `build` above.
      - name: Run e2e tests
        run: brain verify --only e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# The dedicated `non-negotiables` job that stood here was DELETED, not moved: it
# re-ran `check-non-negotiables.ts` over the same tree the `baseline` job had
# already swept via `brain verify --stage baseline`, with no caching between
# them. Its one unique step — the selftest, which proves the gate can fail
# before anyone trusts that it passed — is now a registry entry
# (`non-negotiables-selftest` in .brain/verify.json), so it runs in baseline
# alongside the sweep and the registry stays the single answer to "which gates
# run".
#
# Replaced the `effect-ts-grep` job (a lexical sweep over ADDED DIFF LINES).
# It matched `grep -E '\bthrow new\b'`, so `throw err` walked through; it never
# checked try/catch or Effect.promise at all; its zod pattern was double-quote
# only; non-negotiable #4 (a unit test per helper/repository) had no gate
# anywhere; and because it only read the diff, a violation that moved between
# files became invisible. scripts/check-non-negotiables.ts walks the TypeScript
# AST over the whole tree instead, and carries its own failing fixtures.
