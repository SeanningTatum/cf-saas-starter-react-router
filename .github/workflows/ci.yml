name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline (typecheck + test + harness-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply local D1 migrations
        run: bun run db:migrate:local

      - name: Install brain-axi CLI
        # Pinned for reproducible CI — bump deliberately when adopting a newer CLI.
        # NOTE: the state-integrity gates (schema validation, verdict parsing,
        # index-drift, receipts, `check --strict`) land in the next brain-axi
        # release; until this pin moves, CI runs the older check set.
        run: npm i -g github:SeanningTatum/brain-axi#v0.1.0

      - name: Baseline gates (declared in .brain/verify.json)
        # One entry point: the registry owns WHICH gates run, so adding one is a
        # data change rather than a workflow change. Replaces the previous
        # hardcoded typecheck/test/harness-check step list, which drifted from
        # the recipe and the slash command.
        run: brain verify --stage baseline

  build:
    name: Build (Cloudflare Workers)
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  # Thin, stable smoke specs (auth + critical paths) — the automated regression net.
  # Feature-level proof is the feature-verifier sub-agent → .brain/features/<slug>/verifications/ (not run in CI).
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply local D1 migrations
        run: bun run db:migrate:local

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  non-negotiables:
    name: Five non-negotiables (AST)
    runs-on: ubuntu-latest
    needs: baseline
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"  # pinned: gate behaviour must be reproducible across PRs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prove the gate can FAIL before trusting that it passed. Each fixture is a
      # violation the previous grep sweep let through.
      - name: Checker selftest
        run: bun run scripts/check-non-negotiables.ts --selftest

      - name: Five non-negotiables
        run: bun run scripts/check-non-negotiables.ts

# Replaced the `effect-ts-grep` job (a lexical sweep over ADDED DIFF LINES).
# It matched `grep -E '\bthrow new\b'`, so `throw err` walked through; it never
# checked try/catch or Effect.promise at all; its zod pattern was double-quote
# only; non-negotiable #4 (a unit test per helper/repository) had no gate
# anywhere; and because it only read the diff, a violation that moved between
# files became invisible. scripts/check-non-negotiables.ts walks the TypeScript
# AST over the whole tree instead, and carries its own failing fixtures.
