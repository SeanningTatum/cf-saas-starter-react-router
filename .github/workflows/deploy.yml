# Production deploy after CI passes on a push to production. Skipped, not failed, until set up.
# The token is a `production` environment secret. Pull-request code cannot read it once
# that environment has a required reviewer and takes deploys only from the default branch
# (bun run scripts/repo-rules.ts --apply; see docs/ci/repo-rules.md). Before that, a branch
# in this repo can add `environment: production` to a workflow of its own.
# See docs/ci/pipelines.md
name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]

concurrency:
  group: deploy-production
  # Never cancel an in-flight production deploy.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readiness:
    name: Check production setup
    runs-on: ubuntu-latest
    # Only on a green CI run for a push to production (CI also runs on PRs).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push' }}
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      # workflow_run checks out the default branch by default — pin to the
      # exact commit that passed CI so we deploy what was tested.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check production setup
        id: gate
        env:
          HAS_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: bun scripts/ci/deploy-gate.ts ready production

  deploy:
    name: Deploy to Cloudflare (production)
    needs: readiness
    runs-on: ubuntu-latest
    if: needs.readiness.outputs.ready == 'true'
    # The restore-point step may use up to 14 minutes of this (scripts/lib/d1-backup-constants.ts),
    # the rollout up to about 15 (three steps, each a minute's soak and a minute of checks).
    timeout-minutes: 45
    environment: production
    outputs:
      outcome: ${{ steps.rollout.outputs.outcome }}
      failed_at: ${{ steps.rollout.outputs.failed_at }}
      version_id: ${{ steps.rollout.outputs.version_id }}
      previous_version_id: ${{ steps.rollout.outputs.previous_version_id }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The token is an environment secret, which the readiness job cannot see,
      # so check it here. Every later step waits on this one.
      - name: Check production token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Deploy Production skipped: the production environment has no CLOUDFLARE_API_TOKEN secret. See docs/ci/pipelines.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.token.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Use the CLOUDFLARE_D1_DATABASE_ID variable
        if: steps.token.outputs.ready == 'true' && vars.CLOUDFLARE_D1_DATABASE_ID != ''
        run: bun scripts/ci/deploy-gate.ts use-d1

      # A way back before the schema changes: a Time Travel bookmark, and an
      # export to a private R2 bucket when D1_BACKUP_BUCKET is set. docs/ci/rollback.md
      - name: Record a restore point before the migration
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_BACKUP_BUCKET: ${{ vars.D1_BACKUP_BUCKET }}
        run: bun scripts/ci/d1-backup.ts

      - name: Apply production D1 migrations
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun run db:migrate:remote || {
            echo "::error::D1 migration failed. If the log says Authentication error, the token lacks D1 Edit. See docs/ci/pipelines.md"
            exit 1
          }

      - name: Build
        if: steps.token.outputs.ready == 'true'
        run: bun run build

      # The error reporter stamps each report with these two vars (docs/agents/error-reporting.md).
      # The version is the vX.Y.Z tag on this commit when release.yml has made one, else the commit sha.
      # release.yml makes lightweight tags; an annotated tag is not matched here and reads as the sha.
      - name: Name the release
        id: release
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[] | "\(.object.sha) \(.ref)"') || {
            echo "::warning::Could not list the version tags, so the release is named by its commit sha."
            TAGS=""
          }
          printf '%s\n' "$TAGS" | bun scripts/ci/release-version.ts "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      # Uploads a version, then moves traffic 10%, 50%, 100% with a smoke check of /healthz,
      # pinned to the new version, after each step. A failed check or step sends all traffic
      # back to the version that ran before, and the run fails. docs/ci/rollback.md#automatic-rollback
      - name: Roll out to Cloudflare Workers in steps
        id: rollout
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: bun scripts/ci/rollout.ts

  # A failed production deploy or an automatic rollback is announced on GitHub: the failed run,
  # its job summary, and one open issue that each failure comments on. The only job that can
  # write issues; it checks out nothing and runs no repo code.
  announce-failure:
    name: Announce a failed deploy
    needs: deploy
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failed-deploy issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          OUTCOME: ${{ needs.deploy.outputs.outcome }}
          FAILED_AT: ${{ needs.deploy.outputs.failed_at }}
          VERSION_ID: ${{ needs.deploy.outputs.version_id }}
          PREVIOUS_VERSION_ID: ${{ needs.deploy.outputs.previous_version_id }}
        run: |
          title="Production deploy failed"
          {
            echo "Commit \`$DEPLOY_SHA\` did not reach production: **${OUTCOME:-failed before the rollout}**."
            [ -n "$FAILED_AT" ] && echo "The smoke check or the traffic move failed at $FAILED_AT% of traffic."
            [ "$OUTCOME" = "rolled-back" ] && echo "All traffic went back to version \`$PREVIOUS_VERSION_ID\`. The database keeps any migration this deploy ran."
            [ "$OUTCOME" = "rollback-failed" ] && echo "**The rollback failed.** Run \`bunx wrangler versions deploy $PREVIOUS_VERSION_ID@100% -y\` now."
            [ -n "$VERSION_ID" ] && echo "New version: \`$VERSION_ID\`."
            echo
            echo "Run: $RUN_URL. What to do next: docs/ci/rollback.md"
          } > body.md
          number=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file body.md
          else
            gh issue create --repo "$REPO" --title "$title" --body-file body.md
          fi
      # A chat or email webhook would be one more step here, reading the same env and body.md.
