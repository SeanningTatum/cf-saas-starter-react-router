# Production deploy after CI passes on a push to main. Skipped, not failed, until set up.
# The token is a `production` environment secret. Pull-request code cannot read it only
# once that environment has a required reviewer and default-branch-only deploys
# (bun run scripts/repo-rules.ts --apply, from #67); before that, a branch in this repo
# can add `environment: production` to a workflow of its own. See docs/ci/pipelines.md
name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  # Never cancel an in-flight production deploy.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readiness:
    name: Check production setup
    runs-on: ubuntu-latest
    # Only on a green CI run for a push to main (CI also runs on PRs).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push' }}
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      # workflow_run checks out the default branch by default — pin to the
      # exact commit that passed CI so we deploy what was tested.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check production setup
        id: gate
        env:
          HAS_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: bun scripts/ci/deploy-gate.ts ready production

  deploy:
    name: Deploy to Cloudflare (production)
    needs: readiness
    runs-on: ubuntu-latest
    if: needs.readiness.outputs.ready == 'true'
    # The restore-point step may use up to 14 minutes of this (scripts/lib/d1-backup-constants.ts).
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The token is an environment secret, which the readiness job cannot see,
      # so check it here. Every later step waits on this one.
      - name: Check production token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Deploy Production skipped: the production environment has no CLOUDFLARE_API_TOKEN secret. See docs/ci/pipelines.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.token.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Use the CLOUDFLARE_D1_DATABASE_ID variable
        if: steps.token.outputs.ready == 'true' && vars.CLOUDFLARE_D1_DATABASE_ID != ''
        run: bun scripts/ci/deploy-gate.ts use-d1

      # A way back before the schema changes: a Time Travel bookmark, and an
      # export to a private R2 bucket when D1_BACKUP_BUCKET is set. docs/ci/rollback.md
      - name: Record a restore point before the migration
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_BACKUP_BUCKET: ${{ vars.D1_BACKUP_BUCKET }}
        run: bun scripts/ci/d1-backup.ts

      - name: Apply production D1 migrations
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun run db:migrate:remote || {
            echo "::error::D1 migration failed. If the log says Authentication error, the token lacks D1 Edit. See docs/ci/pipelines.md"
            exit 1
          }

      - name: Build
        if: steps.token.outputs.ready == 'true'
        run: bun run build

      - name: Deploy to Cloudflare Workers
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy

      - name: Deploy summary
        if: steps.token.outputs.ready == 'true'
        run: |
          {
            echo "### Production deploy"
            echo
            echo "Deployed commit \`$DEPLOY_SHA\` to Cloudflare Workers (production)."
          } >> "$GITHUB_STEP_SUMMARY"
